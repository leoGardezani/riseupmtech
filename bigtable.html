<script src="assets/shell.js?v=20261118f"></script>
<div class="main" id="main">
  <div class="tab-page active" id="tab-bigtable">
    <div class="section-title">Big Table</div>
    <div class="section-sub">Linhas do plano de mídia — taxonomia e status de implementação</div>
    <div class="bt-toolbar">
      <select class="repo-filter-sel" id="btWorkspace" style="min-width:200px"><option value="">Carregando...</option></select>
      <input class="bt-search" id="btSearch" placeholder="Buscar campanha, criativo, plataforma..." oninput="btFilter()">
      <select class="repo-filter-sel" id="bt-fplat" onchange="btFilter()"><option value="">Todas as plataformas</option></select>
      <select class="repo-filter-sel" id="bt-fcamp" onchange="btFilter()"><option value="">Todas as campanhas</option></select>
      <button class="bt-btn ghost" onclick="btDownload('csv')">↓ CSV</button>
      <button class="bt-btn" onclick="btDownload('xlsx')">↓ Excel</button>
      <span class="bt-info" id="bt-info">— linhas</span>
    </div>
    <div class="bt-wrap">
      <table class="bt-table" id="btTable">
        <thead>
          <tr>
            <th onclick="btSort('criativo')" style="min-width:200px">Criativo</th>
            <th onclick="btSort('plat')" class="bt-col-group-taxonomy">Plataforma</th>
            <th onclick="btSort('camp')" class="bt-col-group-taxonomy">Campanha</th>
            <th onclick="btSort('medium')" class="bt-col-group-taxonomy">Meio</th>
            <th onclick="btSort('status')" class="bt-col-group-delivery">Status</th>
            <th onclick="btSort('id')" class="bt-col-group-delivery">ID na plataforma</th>
            <th onclick="btSort('start')" class="bt-col-group-delivery">Início</th>
            <th onclick="btSort('end')" class="bt-col-group-delivery">Fim</th>
            <th onclick="btSort('row_id')" class="bt-col-group-delivery">Row ID</th>
          </tr>
        </thead>
        <tbody id="btBody"></tbody>
      </table>
    </div>
    <div style="font-family:var(--mono);font-size:9px;color:var(--ink-muted);margin-top:12px;line-height:1.6">// métricas de desempenho (impressões, cliques, custo, conversões) em breve</div>
  </div>
</div>

<script src="assets/core.js?v=20261118f"></script>
<script src="assets/pages/bigtable.js?v=20261118f"></script>
</body>
</html>
